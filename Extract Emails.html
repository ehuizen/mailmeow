<body>
<div class="main_container">
    <div class="inputs box">
        <!-- <p>Character Limit:</p>
        <input class="txtBox"type="text" id="charLimit" placeholder="Enter your character limit"><br> -->
        <h3 class="title">Extract Emails</h3>
        <p>Enter your data below:</p>
        <input class="txtBox" type="text" id="inputT" placeholder="Paste the pdf content here">
        <button class="btn btnPrimary" onclick="getEmails()">Get Emails</button>
        <button class="btn btnSecondary" onclick="getEmailsNoDuplicates()">Get Emails without duplicates</button>
        <textarea class="result" name="result" id="result" cols="30" rows="10"></textarea><br>
        <button class="btn btnCopy" id="btnCopy" onclick="copyTo()">Copy emails</button>
    </div>
    <div class="inputs box">
        <h3 class="title">Remove Bounced Emails</h3>
        <div style="display: flex;align-items: center; justify-content: start; margin: 0px 0px 20px 0px ;">
            <input type="checkbox" id="removeBouncedCheckbox" onclick="toggleBouncedBox()" style="transform: scale(1.2); cursor: pointer; width: 30px;"> 
            <span>Remove emails based on bounces?</span>
        </div>
        <p>Upload CSV bounce list</p>
        <input type="file" id="fileInput" accept=".csv" />
    </div>

<script>
function toggleBouncedBox() {
    const checkbox = document.getElementById("removeBouncedCheckbox");
    const bouncedEmailsBox = document.getElementById("bouncedEmails");
    bouncedEmailsBox.disabled = !checkbox.checked;
}
</script>
    
</div>
    
<script>

function getEmails(){
    textarea = document.getElementById("result");
    let emailList = []
    var reg = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,4}\b/;
    let inputText = document.getElementById("inputT").value;
    let emails = inputText.replace(/\t/g, ' ');
    let emailsNocomma = emails.replace(/[<>"";,'{}\/\\]+/g, ' ');
    let emailsClean = emailsNocomma.replace(/;/g, ' ').split(" ");
    console.log(emailsNocomma);

    for(let i = 0; i < emailsClean.length; i++){
        if(reg.test(emailsClean[i]) === true && emailsClean[i].length < 40){
            emailList.push(emailsClean[i].toLowerCase());
        }
    }
    textarea.value = emailList.join("\n")
}

function getEmailsNoDuplicates(){
    textarea = document.getElementById("result");
    let emailList = []
    var reg = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,4}\b/;
    let inputText = document.getElementById("inputT").value;
    let emails = inputText.replace(/\t/g, ' ');
    let emailsNocomma = emails.replace(/[<>"";,'{}\/\\]+/g, ' ');
    let emailsClean = emailsNocomma.replace(/;/g, ' ').split(" ");

    for(let i = 0; i < emailsClean.length; i++){
        if(reg.test(emailsClean[i]) === true && emailsClean[i].length < 40){
            emailList.push(emailsClean[i].toLowerCase());
        }
    }
    let noDups = [...new Set(emailList)]
    var dupNumber = emailList.length - noDups.length;
    textarea.value = noDups.join("\n");
    
}

function copyTo() {
    var copyText = document.getElementById("result");
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);
    var btnCopy = document.getElementById("btnCopy");
    btnCopy.innerText = "Copied!";
    setTimeout(() => {
        btnCopy.innerText = "Copy";
    }, 1000);
}

function getBounceEmails(){
    textarea = document.getElementById("result");
    let emailList = []
    var reg = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,4}\b/;
    let inputText = document.getElementById("inputT").value;
    let emails = inputText.replace(/\t/g, ' ');
    let emailsNocomma = emails.replace(/[<>"";,'{}\/\\]+/g, ' ');
    let emailsClean = emailsNocomma.replace(/;/g, ' ').split(" ");
    console.log(emailsNocomma);

    for(let i = 0; i < emailsClean.length; i++){
        if(reg.test(emailsClean[i]) === true && emailsClean[i].length < 40){
            emailList.push(emailsClean[i].toLowerCase());
        }
    }
    textarea.value = emailList.join("\n")
}
