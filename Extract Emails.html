<!DOCTYPE html>
<!-- Version 1.4 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Email Split
    </title>
</head>
<body>
<div class="main_container">
    <div class="box main_box">
        <h3 class="title">Extract Emails</h3>
        <p>Enter your data below:</p>
        <input class="txtBox" type="text" id="inputT" placeholder="Paste the pdf content here">
        <div class="btnBox">
            <button id="btnGetEmails" class="btn btnPrimary" onclick="getEmails()">Get emails</button>
            <button id="btnDuplicates" class="btn btnSecondary" onclick="getEmailsNoDuplicates()" disabled>Remove duplicates</button>
            <button id="btnBounces" class="btn btnWarning" onclick="removeBounces()" disabled>Remove bounces</button>
        </div>
        <textarea class="result" name="result" id="result" cols="30" rows="10"></textarea><br>
        <button class="btn btnCopy" id="btnCopy" onclick="copyTo()">Copy emails</button>
    </div>
    <div class="box secondary_box">
        <h3 class="title">Previously Bounced Emails</h3>
        <div class="bounce_inputs">
            <p>Upload CSV bounce list</p>
            <div>
                <input type="file" id="fileInput" accept=".csv" onchange="loadBounceEmails(event)"/>
            </div>
        </div>
        <p>Previously bounced emails:</p>
        <textarea class="result" name="bouncedEmailsResultBox" id="bouncedEmailsResultBox" cols="30" rows="10"></textarea>
    </div>
</div>
    
<script>

let arrBouncedEmails;
let finalEmailList;
let hasEmailList = false;

function getEmails(){
    textarea = document.getElementById("result");
    let emailList = []
    var reg = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,4}\b/;
    let inputText = document.getElementById("inputT").value;
    let emails = inputText.replace(/\t/g, ' ');
    let emailsNocomma = emails.replace(/[<>"";,'{}\/\\]+/g, ' ');
    finalEmailList = emailsNocomma.replace(/;/g, ' ').split(" ");
    for(let i = 0; i < finalEmailList.length; i++){
        if(reg.test(finalEmailList[i]) === true && finalEmailList[i].length < 40){
            emailList.push(finalEmailList[i].toLowerCase());
        }
    }
    textarea.value = finalEmailList.join("\n")
    document.getElementById("btnDuplicates").disabled = false;
    hasEmailList = true;
    if(document.getElementById("btnDuplicates").innerText === "Duplicates removed!"){
        document.getElementById("btnDuplicates").innerText = "Remove duplicates";
    }
}

function getEmailsNoDuplicates(){
    textarea = document.getElementById("result");
    let noDuplicateEmails = [...new Set(finalEmailList)]
    textarea.value = noDuplicateEmails.join("\n");
    document.getElementById("btnDuplicates").innerText = "Duplicates removed!";
    
}

//Copy data to clipboard
function copyTo() {
    var copyText = document.getElementById("result");
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);
    var btnCopy = document.getElementById("btnCopy");
    btnCopy.innerText = "Copied!";
    setTimeout(() => {
        btnCopy.innerText = "Copy";
    }, 1000);
}

// Get emails from csv
function loadBounceEmails(e) {

    const file = e.target.files[0];
    if(file){
    const reader = new FileReader();
    

    reader.onload = function(e) {
        let bounceResultDisplay = document.getElementById("bouncedEmailsResultBox"); // getting the result box
        const content = e.target.result;        
        const cleanedContent = content.replace(/^"|"$/g, "");
        arrBouncedEmails = cleanedContent.split(/[\s,]+/).filter(item => item.trim() !== "");
            //Activate remove bounced emails button
            if(arrBouncedEmails.length > 0){
                document.getElementById("btnBounces").disabled = false;
            } else {
                document.getElementById("btnBounces").disabled = true;
            }
        bounceResultDisplay.value = arrBouncedEmails.join("\n");
        
    };

    reader.onerror = function(e) {
        console.error("Error reading file", e);
        alert("Failed to read file!");
    };

    reader.readAsText(file);
    } else {
        console.log("No file selected.");
    }
    
}

//Remove Bounced Emails
function removeBounces(){
    let emailList = document.getElementById("result").value.split("\n");
    console.log(emailList);
    document.getElementById("btnDuplicates").disabled = true;
    document.getElementById("btnGetEmails").disabled = true;

    // Add logic to remove bounced emails from the emailList
    emailList = emailList.filter(email => !arrBouncedEmails.includes(email.trim()));
    document.getElementById("result").value = emailList.join("\n");
    document.getElementById("btnBounces").disabled = true;

}


</script>
</body>
</html>
